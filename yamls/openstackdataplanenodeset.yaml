apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: openstack
spec:
  tlsEnabled: true
  networkAttachments:
    - ctlplane-osp18
  preProvisioned: true
  services:
    - bootstrap
    - download-cache
    - configure-network
    - validate-network
    - install-os
    - configure-os
    - ssh-known-hosts
    - run-os
    - install-certs
    - libvirt
    - nova
    - ovn
    - neutron-metadata
    - neutron-dhcp
  env:
    - name: ANSIBLE_FORCE_COLOR
      value: "True"
  nodes:
    compute-0:
      hostName: compute-0
      ansible:
        ansibleHost: 172.22.0.170
      networks:
      - name: ctlplane-osp18
        fixedIP: 172.22.0.170
        subnetName: ctlplane-osp18
      - name: internalapi-osp18
        fixedIP: 172.17.0.170
        subnetName: internalapi-osp18
      - name: storage-osp18
        fixedIP: 172.18.0.170
        subnetName: storage-osp18
      - name: tenant-osp18
        fixedIP: 172.20.0.170
        subnetName: tenant-osp18
    compute-1:
      hostName: compute-1
      ansible:
        ansibleHost: 172.22.0.180
      networks:
      - name: ctlplane-osp18
        fixedIP: 172.22.0.180
        subnetName: ctlplane-osp18
      - name: internalapi-osp18
        fixedIP: 172.17.0.180
        subnetName: internalapi-osp18
      - name: storage-osp18
        fixedIP: 172.18.0.180
        subnetName: storage-osp18
      - name: tenant-osp18
        fixedIP: 172.20.0.180
        subnetName: tenant-osp18 
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-adoption-secret
    ansible:
      ansibleUser: root
      ansibleVarsFrom:
        - prefix: subscription_manager_
          secretRef:
            name: subscription-manager
        - prefix: registry_
          secretRef:
            name: redhat-registry
      ansibleVars:
        edpm_bootstrap_release_version_package: []
        service_net_map:
          nova_api_network: internalapi-osp18
          nova_libvirt_network: internalapi-osp18

        # edpm_network_config
        # Default nic config template for a EDPM compute node
        # These vars are edpm_network_config role vars
        edpm_network_config_template: |
           ---
           {% set mtu_list = [ctlplane_mtu] %}
           {% for network in role_networks %}
           {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
           {%- endfor %}
           {% set min_viable_mtu = mtu_list | max %}
           network_config:
           # BMH provisioning interface used for ctlplane
           - type: interface
             name: nic1
             mtu: 1500
             use_dhcp: false
             dns_servers: {{ ctlplane_dns_nameservers }}
             domain: {{ dns_search_domains }}
             addresses:
             - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_subnet_cidr }}
             routes: {{ ctlplane_host_routes }}
           # Disable OCP cluster interface
           - type: interface
             name: nic2
             mtu: 1500
             use_dhcp: false
           {% for network in networks_all if network not in networks_skip_config|default([]) %}
           {% if network == 'External' %}
           - type: ovs_bridge
             name: {{ neutron_physical_bridge_name }}
             mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
             dns_servers: {{ ctlplane_dns_nameservers }}
             use_dhcp: false
           {% if network in role_networks %}
             addresses:
             - ip_netmask:
                 {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
             routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
           {% endif %}
             members:
             - type: interface
               name: nic3
               mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
               primary: true
           {% endif %}
           {% endfor %}
           - type: ovs_bridge
             name: br-tenant
             mtu: {{ min_viable_mtu }}
             use_dhcp: false
             members:
             - type: interface
               name: nic4
               mtu: {{ min_viable_mtu }}
               use_dhcp: false
               primary: true
           {% for network in networks_all if network not in networks_skip_config|default([]) %}
           {% if network not in ["External"] and network in role_networks %}
             - type: vlan
               mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
               vlan_id: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
               addresses:
               - ip_netmask:
                   {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
               routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
           {% endif %}
           {% endfor %}
           
        edpm_network_config_hide_sensitive_logs: false
        #
        # These vars are for the network config templates themselves and are
        # considered EDPM network defaults.
        neutron_physical_bridge_name: br-ex
        neutron_public_interface_name: nic3
        
        # edpm_nodes_validation
        edpm_nodes_validation_validate_controllers_icmp: false
        edpm_nodes_validation_validate_gateway_icmp: false

        # edpm ovn-controller configuration
        edpm_ovn_bridge_mappings: datacentre:br-ex
        edpm_ovn_bridge: br-int
        edpm_ovn_encap_type: geneve
        ovn_match_northd_version: false
        ovn_monitor_all: true
        edpm_ovn_remote_probe_interval: 60000
        edpm_ovn_ofctrl_wait_before_clear: 8000

        role_networks:
          - ctlplane
          - internal_api
          - storage
          - tenant

        timesync_ntp_servers:
          - hostname: clock.redhat.com
          - hostname: clock2.redhat.com

        edpm_bootstrap_command: |
          subscription-manager register --username {{ subscription_manager_username }} --password {{ subscription_manager_password }}
          subscription-manager release --set=9.2
          subscription-manager repos --disable=*
          subscription-manager repos --enable=rhel-9-for-x86_64-baseos-eus-rpms --enable=rhel-9-for-x86_64-appstream-eus-rpms --enable=rhel-9-for-x86_64-highavailability-eus-rpms --enable=openstack-17.1-for-rhel-9-x86_64-rpms --enable=fast-datapath-for-rhel-9-x86_64-rpms --enable=openstack-dev-preview-for-rhel-9-x86_64-rpms
          # FIXME: perform dnf upgrade for other packages in EDPM ansible
          # here we only ensuring that decontainerized libvirt can start
          dnf -y upgrade openstack-selinux
          rm -f /run/virtlogd.pid
          podman login -u {{ registry_username }} -p {{ registry_password }} registry.redhat.io

        gather_facts: false
        enable_debug: false
        # edpm firewall, change the allowed CIDR if needed
        edpm_sshd_configure_firewall: true
        edpm_sshd_allowed_ranges: 
          - 192.168.122.0/24
          - 172.22.0.0/24
        # SELinux module
        edpm_selinux_mode: enforcing

        # Do not attempt OVS major upgrades here
        edpm_ovs_packages:
          - openvswitch3.1
