apiVersion: v1
kind: Pod
metadata:
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name":"ctlplane","namespace":"osp18","interface":"ctlplane"}]'
    openshift.io/scc: privileged
    seccomp.security.alpha.kubernetes.io/pod: runtime/default
  labels:
    app: centos
  name: zorro
  namespace: osp18
spec:
  containers:
  - name: fedora
    image: wbitt/network-multitool:openshift-extra
    command: [ "/bin/bash", "-c", "--"]
    args: [ "while true; do sleep 3000; done;" ]
    imagePullPolicy: IfNotPresent
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        add:
        - NET_ADMIN
      # capabilities:
      #   drop:
      #   - ALL
      #   add:
      #   - ALL
#      runAsNonRoot: true
#      runAsUser: 1000740000
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  nodeName: ostest-master-1
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Never
  schedulerName: default-scheduler
  securityContext:
    fsGroup: 1000740000
    seLinuxOptions:
      level: s0:c27,c19
    seccompProfile:
      type: RuntimeDefault
  serviceAccount: openstack
  serviceAccountName: openstack
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
