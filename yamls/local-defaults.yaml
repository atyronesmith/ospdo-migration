ocp_disconnected_install: false

ocp_network_type: OVNKubernetes

osp_ctlplane_node_selector:
  kubernetes.io/hostname: ostest-master-0

# ocp_master_disk: 120
# ocp_worker_disk: 120

ocp_num_masters: 3
ocp_num_workers: 0
ocp_num_extra_workers: 3
ocp_master_memory: 60000
ocp_master_vcpu: 12
ocp_master_disk: 150
ocp_worker_disk: 100

nfs_pvs:
  - size: 10
    number: 16
  - size: 128
    number: 8
  - size: 128
    number: 12
    shared: true

osp_release_defaults:
  tlse: true
  base_image_url: https://download.devel.redhat.com/rhel-9/rel-eng/RHEL-9/latest-RHEL-9.2.0/compose/BaseOS/x86_64/images/rhel-guest-image-9.2-20230414.17.x86_64.qcow2
  attach_configs:
    br-ctlplane:
      interfaces:
      - type: bridge
        name: br-ctlplane
        interface: enp1s0
        dhcp: true
        mtu: 1500
    br-osp:
      interfaces:
      - type: bridge
        name: br-osp
        interface: enp7s0
        mtu: 9000
      - type: ethernet
        interface: enp7s0
        mtu: 9000
    br-ex:
      interfaces:
      - type: bridge
        name: br-external
        interface: enp6s0
        mtu: 1500
          #- type: ethernet
          #interface: enp6s0
          #mtu: 1500


osp_networks:
  ctlplane:
    name: Control
    name_lower: ctlplane
    is_control_plane: true
    subnets:
    - name: ctlplane
      ipv4:
        cidr: 172.22.0.0/24
        gateway: 172.22.0.1
        allocation:
          start: 172.22.0.150
          end: 172.22.0.254
      attach_config: br-ctlplane
  internalapi:
    name: InternalApi
    name_lower: internal_api
    subnets:
    - name: internal_api
      vlan: 20
      ipv4:
        cidr: 172.17.0.0/24
        allocation:
          start: 172.17.0.150
          end: 172.17.0.250
      attach_config: br-osp
  external:
    name: External
    name_lower: external
    subnets:
    - name: external
      ipv4:
        cidr: 10.0.0.0/24
        gateway: 10.0.0.1
        allocation:
          start: 10.0.0.150
          end: 10.0.0.250
      attach_config: br-ex
  storage:
    name: Storage
    name_lower: storage
    mtu: 9000
    subnets:
    - name: storage
      vlan: 30
      ipv4:
        cidr: 172.18.0.0/24
        allocation:
          start: 172.18.0.150
          end: 172.18.0.250
      attach_config: br-osp
  storagemgmt:
    name: StorageMgmt
    name_lower: storage_mgmt
    subnets:
    - name: storage_mgmt
      vlan: 40
      ipv4:
        cidr: 172.19.0.0/24
        allocation:
          start: 172.19.0.150
          end: 172.19.0.250
      attach_config: br-osp
  tenant:
    name: Tenant
    name_lower: tenant
    vip: false
    mtu: 9000
    subnets:
    - name: tenant
      vlan: 50
      vip: false
      ipv4:
        cidr: 172.20.0.0/24
        allocation:
          start: 172.20.0.150
          end: 172.20.0.250
      attach_config: br-osp
