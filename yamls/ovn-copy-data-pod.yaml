apiVersion: v1
kind: Pod
metadata:
  name: ovn-copy-data
  namespace: ${NAMESPACE}
  annotations:
    openshift.io/scc: anyuid
    k8s.v1.cni.cncf.io/networks: |-
      [
        {
          "name": "${INTERNAL_API}", 
          "namespace": "${NAMESPACE}",
          "ips": ["172.17.0.98/24"] 
        }
      ]
  labels:
    app: adoption
spec:
  containers:
  - image: ${OVSDB_IMAGE}
    command: [ "sh", "-c", "sleep infinity"]
    name: ovndb-client
    volumeMounts:
    - mountPath: /backup
      name: ovn-data
    # - mountPath: /etc/pki/tls/misc
    #   name: ovn-data-cert
    #   readOnly: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: ovn-data
    persistentVolumeClaim:
      claimName: ovn-data
  # - name: ovn-data-cert
  #   secret:
  #     secretName: ovn-data-cert
